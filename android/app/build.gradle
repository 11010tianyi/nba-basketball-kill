apply plugin: 'com.android.application'

def ciBuild = System.getenv("CI") == "true"
// Same path the workflow restores ANDROID_DEBUG_KEYSTORE_BASE64 into.
def debugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")

android {
    namespace = "com.tianyi.nbabasketballkill"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tianyi.nbabasketballkill"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        if (ciBuild) {
            def versionNameProp = project.findProperty("appVersionName")
            def versionCodeProp = project.findProperty("appVersionCode")
            if (versionNameProp == null || versionCodeProp == null) {
                throw new GradleException("CI debug builds must pass -PappVersionName and -PappVersionCode so the APK matches the GitHub Release tag.")
            }
            versionName versionNameProp.toString()
            versionCode Integer.parseInt(versionCodeProp.toString())
        } else {
            versionCode 1
            versionName "1.0"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI must sign with the restored keystore. Leaving debug signing on AGP's
    // default makes validateSigningDebug create a new debug.keystore whenever
    // its prefs directory is not ~/.android (for example when XDG_CONFIG_HOME
    // is set). A non-default alias also stops that auto-create path.
    if (ciBuild) {
        def storeTypeProp = project.findProperty("debugKeystoreType")
        if (storeTypeProp == null || storeTypeProp.toString().trim().isEmpty()) {
            throw new GradleException("CI debug builds must pass -PdebugKeystoreType from keytool so the restored keystore is loaded as itself.")
        }
        signingConfigs {
            debug {
                storeFile debugKeystore
                storePassword "android"
                keyPassword "android"
                keyAlias "androiddebugkey"
                storeType storeTypeProp.toString().trim()
            }
        }
    }
    buildTypes {
        debug {
            if (ciBuild) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// GitHub Actions sets CI=true. The signingConfigs.debug block above is what
// actually selects the restored key. This check still refuses to start if
// that file was never restored.
def ciDebugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
gradle.taskGraph.whenReady { taskGraph ->
    def buildsDebug = taskGraph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains("assembledebug") || name.contains("bundledebug") || name == "packagedebug"
    }
    if (System.getenv("CI") == "true" && buildsDebug) {
        if (!ciDebugKeystore.isFile() || ciDebugKeystore.length() == 0L) {
            throw new GradleException("CI debug builds require ~/.android/debug.keystore restored from ANDROID_DEBUG_KEYSTORE_BASE64. Refusing to generate a new debug keystore.")
        }
    }
}
