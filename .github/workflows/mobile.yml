name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/prepare-mobile-web.mjs"
      - "scripts/generate-card-packs-manifest.mjs"
      - ".github/workflows/mobile.yml"
      - ".github/scripts/publish-android-debug-apk.sh"
      - ".github/scripts/verify-android-debug-cert.sh"

# contents: write lets GITHUB_TOKEN create the release tag and upload the APK.
# actions: write keeps the debug APK Actions artifact upload working when
# permissions are listed explicitly. The debug signing key is the repository
# secret ANDROID_DEBUG_KEYSTORE_BASE64, not a GITHUB_TOKEN permission. This
# workflow does not commit version bumps, so a release cannot retrigger itself.
permissions:
  contents: write
  actions: write

# Queue builds so two runs cannot claim the same patch tag.
concurrency:
  group: android-debug-release
  cancel-in-progress: false

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 defaulted to the removed SDK package "tools". On current
          # GitHub-hosted runners that makes cmdline-tools exit 1 with
          # "Failed to find package 'tools'". v4 installs cmdline-tools
          # itself and only requests platform-tools; it also skips "tools"
          # if a caller still asks for it.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check

      - name: Sync Android
        run: npm run android:sync

      # Restore the persisted keystore before Gradle. AGP's default debug
      # keystore is not always ~/.android/debug.keystore: if XDG_CONFIG_HOME
      # (or ANDROID_SDK_HOME) points somewhere else, validateSigningDebug
      # creates a new key there and the APK cannot update the previous install.
      - name: Restore persistent debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="${HOME}/.android/debug.keystore"
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is missing or empty. Refusing to generate a new debug keystore; a fresh key would make this APK fail to update over the previous CI build (INSTALL_FAILED_UPDATE_INCOMPATIBLE)."
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          if ! printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"; then
            rm -f "${keystore_path}"
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not valid base64. Refusing to continue."
            exit 1
          fi
          chmod 600 "${keystore_path}"
          if [ ! -s "${keystore_path}" ]; then
            rm -f "${keystore_path}"
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 decoded to an empty file. Refusing to continue."
            exit 1
          fi
          if ! keytool -list -keystore "${keystore_path}" -storepass android -alias androiddebugkey >/dev/null; then
            rm -f "${keystore_path}"
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not a usable Android debug keystore. Expected store password android and alias androiddebugkey. Refusing to let Gradle create a replacement."
            exit 1
          fi
          store_type="$(keytool -list -keystore "${keystore_path}" -storepass android | awk -F': ' '/^Keystore type:/{print $2; exit}')"
          store_type="${store_type//$'\r'/}"
          store_type="${store_type#"${store_type%%[![:space:]]*}"}"
          store_type="${store_type%"${store_type##*[![:space:]]}"}"
          if [[ "$store_type" != "PKCS12" && "$store_type" != "JKS" ]]; then
            echo "::error::Refusing to continue. keytool reported keystore type '${store_type}', expected PKCS12 or JKS."
            exit 1
          fi
          cert_sha="$(keytool -list -v -keystore "${keystore_path}" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}')"
          cert_sha="${cert_sha//$'\r'/}"
          if [[ -z "$cert_sha" ]]; then
            echo "::error::keytool did not print a SHA-256 for alias androiddebugkey."
            exit 1
          fi
          # A later Gradle task must not be able to replace this file with a new key.
          chmod a-w "${keystore_path}"
          echo "DEBUG_KEYSTORE_TYPE=${store_type}" >> "$GITHUB_ENV"
          echo "DEBUG_CERT_SHA256=${cert_sha}" >> "$GITHUB_ENV"
          echo "Restored debug keystore type: ${store_type}"
          echo "Restored androiddebugkey SHA-256: ${cert_sha}"

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(.github/scripts/publish-android-debug-apk.sh --print-version)"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Could not resolve a vMAJOR.MINOR.PATCH tag (got '${tag}')."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if ((10#$patch >= 1000)); then
            echo "::error::Patch ${patch} does not fit versionCode."
            exit 1
          fi
          version_name="${major}.${minor}.${patch}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          echo "ANDROID_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "Release ${tag}: versionName ${version_name}, versionCode ${version_code}"

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail
          # Pin AGP's default prefs directory to the restored keystore, and
          # drop the variables that would send it somewhere else. signingConfigs
          # in app/build.gradle is what the APK is actually signed with.
          unset ANDROID_SDK_HOME ANDROID_PREFS_ROOT XDG_CONFIG_HOME || true
          export ANDROID_USER_HOME="${HOME}/.android"
          # GitHub's egress sometimes 504s or stalls while fetching the Gradle
          # distribution. Retry only that download. Compile and signing
          # failures exit immediately.
          log="${RUNNER_TEMP:-/tmp}/gradle-assemble.log"
          max_attempts=3
          for attempt in 1 2 3; do
            set +e
            ./gradlew assembleDebug \
              -PappVersionName="${APP_VERSION_NAME}" \
              -PappVersionCode="${APP_VERSION_CODE}" \
              -PdebugKeystoreType="${DEBUG_KEYSTORE_TYPE}" \
              2>&1 | tee "$log"
            code="${PIPESTATUS[0]}"
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            download_failure=0
            if grep -Eq 'Could not install Gradle distribution|Downloading from https://services\.gradle\.org/distributions/.*failed|SocketTimeoutException|Read timed out|ConnectException|UnknownHostException|Server returned HTTP response code: (408|429|500|502|503|504)' "$log"; then
              download_failure=1
            fi
            if grep -Eq 'Compilation failed|Execution failed for task '"'"':app:compile|Execution failed for task '"'"':app:packageDebug|Execution failed for task '"'"':app:validateSigningDebug|Keystore was tampered|Failed to read key' "$log"; then
              download_failure=0
            fi
            if [ "$download_failure" -eq 1 ] && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Gradle distribution download failed on attempt ${attempt}/${max_attempts}. Waiting 15s before retrying."
              sleep 15
              continue
            fi
            if [ "$download_failure" -eq 1 ]; then
              echo "::error::Gradle distribution download failed after ${max_attempts} attempts."
            else
              echo "::error::assembleDebug failed for a compile or signing reason. Not retrying."
            fi
            exit "$code"
          done

      - name: Verify APK certificate and version
        env:
          DEBUG_CERT_SHA256: ${{ env.DEBUG_CERT_SHA256 }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          set -euo pipefail
          .github/scripts/verify-android-debug-cert.sh \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "${HOME}/.android/debug.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-basketball-kill-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_TAG: ${{ env.ANDROID_RELEASE_TAG }}
        run: .github/scripts/publish-android-debug-apk.sh android/app/build/outputs/apk/debug/app-debug.apk
